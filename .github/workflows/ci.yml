name: CI

# The contributor version gate existed as an npm script that nothing ran.
# A gate nobody invokes is documentation, so this workflow is the point at
# which it becomes enforcement.
on:
  pull_request:
  push:
    branches: [master]

jobs:
  contributor-version-gate:
    name: Contributor version gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate resolves a merge base and reads the PREVIOUS version
          # tokens with `git show <base>:<path>`. A shallow clone has no
          # merge base, and the gate exits 2 rather than guessing - so the
          # full history is not optional here.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The gate's own suite first. A gate with failing tests must not be
      # trusted to judge anything else, so this runs before the gate itself.
      - name: Gate self-tests
        run: npm run test:ci-gate

      - name: Contributor version gate
        run: |
          BASE="origin/${{ github.base_ref || 'master' }}"
          git fetch --no-tags origin "${{ github.base_ref || 'master' }}" || true
          node scripts/ci/check-contributor-versions.js --base "$BASE"
